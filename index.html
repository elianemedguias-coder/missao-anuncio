<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#12805F" />
    <title>Missão Anúncio — MedGuias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #12805f;
        --verde-esc: #0b5e45;
        --verde-cl: #e3f4ec;
        --verm: #d6402f;
        --verm-cl: #fce7e4;
        --ouro: #dda23a;
        --ouro-cl: #fbf0da;
        --tinta: #17302a;
        --cinza: #61746d;
        --fundo: #f3f8f5;
        --branco: #fff;
        --linha: #dce8e2;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }
      html {
        overflow-x: clip;
      }
      body {
        overflow-x: clip;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: var(--fundo);
        color: var(--tinta);
        overflow-x: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      h1,
      h2,
      h3,
      .baloo {
        font-family: "Baloo 2", system-ui, sans-serif;
        margin: 0;
        line-height: 1.1;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.55;
        z-index: 0;
        pointer-events: none;
      }
      .b1 {
        width: 340px;
        height: 340px;
        background: #cfebdd;
        top: -120px;
        right: -120px;
      }
      .b2 {
        width: 260px;
        height: 260px;
        background: #fbe3c2;
        bottom: -100px;
        left: -90px;
      }
      #app {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16px 16px 40px;
        display: flex;
        flex-direction: column;
        overflow-x: clip;
      }
      .barra-topo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .barra-topo .voltar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--branco);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        font-size: 18px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .barra-topo .tit {
        flex: 1;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 700;
        font-size: 20px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--branco);
        border-radius: 99px;
        padding: 6px 11px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .som {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--branco);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        font-size: 17px;
      }
      /* home */
      .hero {
        background: linear-gradient(140deg, var(--verde), #18a37a);
        color: #fff;
        border-radius: 28px;
        padding: 22px 20px;
        position: relative;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .hero::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        right: -50px;
        top: -60px;
      }
      .hero h1 {
        font-size: 34px;
        font-weight: 800;
      }
      .hero p {
        margin: 6px 0 14px;
        opacity: 0.92;
        font-size: 15px;
      }
      .nivel {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nivel .circ {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff;
        color: var(--verde);
        display: grid;
        place-items: center;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        flex: none;
      }
      .nivel .info {
        flex: 1;
      }
      .nivel .bar {
        height: 10px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.3);
        overflow: hidden;
        margin-top: 5px;
      }
      .nivel .bar i {
        display: block;
        height: 100%;
        background: var(--ouro);
        border-radius: 99px;
        transition: width 0.6s;
      }
      .nome-in {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 11px 14px;
        font: inherit;
        font-size: 15px;
        margin-top: 14px;
      }
      .modos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .modo {
        background: var(--branco);
        border-radius: 24px;
        padding: 16px;
        text-align: left;
        box-shadow: 0 4px 14px rgba(18, 128, 95, 0.08);
        position: relative;
        overflow: hidden;
        transition: transform 0.15s;
      }
      .modo:active {
        transform: scale(0.97);
      }
      .modo .ic {
        font-size: 32px;
      }
      .modo h3 {
        font-size: 19px;
        margin-top: 6px;
      }
      .modo p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--cinza);
      }
      .modo.largo {
        grid-column: span 2;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .modo.largo .ic {
        font-size: 40px;
      }
      .modo .canto {
        position: absolute;
        right: -24px;
        bottom: -24px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        opacity: 0.15;
      }
      .rodape-home {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .rodape-home button {
        flex: 1;
        background: var(--branco);
        border-radius: 18px;
        padding: 12px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      /* temas */
      .tema {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--branco);
        border-radius: 22px;
        padding: 14px 16px;
        margin-bottom: 10px;
        width: 100%;
        text-align: left;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .tema .ic {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 26px;
        flex: none;
      }
      .tema .tx {
        flex: 1;
      }
      .tema h3 {
        font-size: 18px;
      }
      .tema small {
        color: var(--cinza);
      }
      .estrelas {
        letter-spacing: 2px;
        font-size: 16px;
      }
      .estrelas .on {
        color: var(--ouro);
      }
      .estrelas .off {
        color: #d5ded9;
      }
      /* jogo pode/não pode */
      .hud {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .hud .prog {
        flex: 1;
        height: 12px;
        background: #ddeae3;
        border-radius: 99px;
        overflow: hidden;
      }
      .hud .prog i {
        display: block;
        height: 100%;
        background: var(--verde);
        border-radius: 99px;
        transition: width 0.4s;
      }
      .vidas {
        font-size: 18px;
        letter-spacing: 1px;
      }
      .combo {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        color: var(--ouro);
        font-size: 18px;
        min-width: 44px;
        text-align: right;
      }
      .palco {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        min-height: 300px;
        overflow: hidden;
        padding: 10px 6px 4px;
        margin: 0 -6px;
      }
      .carta {
        background: var(--branco);
        border-radius: 28px;
        padding: 26px 22px;
        box-shadow: 0 10px 30px rgba(18, 128, 95, 0.14);
        text-align: center;
        touch-action: pan-y;
        user-select: none;
        position: relative;
        transition:
          transform 0.25s,
          opacity 0.25s;
      }
      .carta .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 99px;
        color: #fff;
        margin-bottom: 12px;
      }
      .carta .q {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.35;
        min-height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .carta .dica {
        font-size: 12px;
        color: var(--cinza);
        margin-top: 12px;
      }
      .carta .selo {
        position: absolute;
        top: 18px;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        padding: 2px 12px;
        border-radius: 10px;
        border: 3px solid;
        opacity: 0;
        transform: rotate(-12deg);
      }
      .carta .selo.pode {
        left: 16px;
        color: var(--verde);
        border-color: var(--verde);
      }
      .carta .selo.nao {
        right: 16px;
        color: var(--verm);
        border-color: var(--verm);
        transform: rotate(12deg);
      }
      .botoes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }
      .bt {
        border-radius: 99px;
        padding: 16px;
        font-weight: 700;
        font-size: 17px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
        transition: transform 0.1s;
      }
      .bt:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
      }
      .bt.nao {
        background: var(--verm);
      }
      .bt.pode {
        background: var(--verde);
      }
      .bt.neutro {
        background: var(--tinta);
      }
      .bt.claro {
        background: var(--branco);
        color: var(--tinta);
        box-shadow: 0 3px 0 #d9e4df;
      }
      .feedback {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        max-height: 82vh;
        max-height: 82dvh;
        overflow-y: auto;
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        border-radius: 26px 26px 0 0;
        transform: translateY(110%);
        transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        max-width: 560px;
        margin: 0 auto;
      }
      .feedback.on {
        transform: none;
      }
      .feedback.certo {
        background: #ddf3e7;
      }
      .feedback.errado {
        background: #fce3df;
      }
      .feedback h3 {
        font-size: 24px;
      }
      .feedback.certo h3 {
        color: var(--verde-esc);
      }
      .feedback.errado h3 {
        color: #a8261a;
      }
      .feedback p {
        margin: 6px 0 14px;
        font-size: 15px;
        line-height: 1.45;
      }
      .feedback .bt {
        width: 100%;
      }
      .btn-doc {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        color: var(--tinta);
        border-radius: 99px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 14px;
        margin: 0 0 12px;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
      }
      .prova {
        background: #fff;
        border-radius: 16px;
        padding: 12px 14px;
        margin: 0 0 14px;
        border-left: 5px solid var(--verde);
        font-size: 14px;
        line-height: 1.45;
      }
      .prova .fonte {
        font-weight: 700;
        font-size: 13px;
        color: var(--verde-esc);
      }
      .prova .secao {
        font-size: 12px;
        color: var(--cinza);
        margin: 2px 0 8px;
      }
      .prova blockquote {
        margin: 0 0 8px;
        padding: 0;
        font-style: italic;
        color: #2b3d37;
      }
      .prova blockquote:last-child {
        margin-bottom: 0;
      }
      .prova.eli {
        border-left-color: var(--ouro);
      }
      .prova.eli .fonte {
        color: #8a6410;
      }
      details.ver-doc {
        margin-top: 6px;
      }
      details.ver-doc summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        color: var(--verde);
        list-style: none;
      }
      details.ver-doc summary::-webkit-details-marker {
        display: none;
      }
      details.ver-doc .prova {
        margin: 8px 0 0;
      }
      .timer {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        min-width: 56px;
        text-align: center;
      }
      .timer.pouco {
        color: var(--verm);
        animation: pulsa 0.6s infinite;
      }
      @keyframes pulsa {
        50% {
          transform: scale(1.15);
        }
      }
      .shake {
        animation: shake 0.35s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-8px);
        }
        40%,
        80% {
          transform: translateX(8px);
        }
      }
      .pop {
        animation: pop 0.35s;
      }
      @keyframes pop {
        50% {
          transform: scale(1.06);
        }
      }
      .flutua {
        position: fixed;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 26px;
        pointer-events: none;
        z-index: 40;
        animation: flutua 1s forwards;
      }
      @keyframes flutua {
        to {
          transform: translateY(-70px);
          opacity: 0;
        }
      }
      /* caça */
      .anuncio {
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
      .anuncio.imp {
        background: #fff;
        border: 2px solid #1d1d1d;
      }
      .anuncio.imp.verde {
        border-color: var(--verde);
      }
      .anuncio.imp.azul {
        border-color: #2563eb;
        background: #eef4ff;
      }
      .anuncio.online {
        background: #fff;
        border: 1px solid var(--linha);
      }
      .anuncio .barra-url {
        width: 100%;
        background: #eef3f1;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--cinza);
      }
      .parte {
        background: transparent;
        border: 2px dashed transparent;
        border-radius: 10px;
        padding: 4px 8px;
        text-align: left;
        color: var(--tinta);
        transition: background 0.2s;
      }
      .parte:hover {
        border-color: #cfdcd6;
      }
      .parte.titulo {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 24px;
      }
      .parte.titulo-min {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 700;
        font-size: 22px;
      }
      .parte.sub {
        font-weight: 700;
        color: var(--verde);
      }
      .parte.reg {
        font-weight: 600;
        font-size: 14px;
      }
      .parte.slogan {
        font-style: italic;
        font-weight: 600;
      }
      .parte.cta {
        background: #1d1d1d;
        color: #fff;
        border-radius: 99px;
        font-weight: 700;
      }
      .parte.qr {
        font-family: monospace;
        font-size: 13px;
        border: 2px solid #1d1d1d;
        border-radius: 8px;
        align-self: flex-end;
      }
      .parte.kw {
        background: #eef3f1;
        border-radius: 99px;
        font-size: 14px;
      }
      .parte.arquivo {
        background: #fff6e6;
        font-size: 14px;
        font-family: monospace;
      }
      .parte.linha {
        font-size: 14px;
      }
      .parte.achou {
        background: var(--verm-cl);
        border: 2px solid var(--verm);
        text-decoration: line-through;
        text-decoration-color: rgba(214, 64, 47, 0.6);
      }
      .parte.certinho {
        background: var(--verde-cl);
        border: 2px solid var(--verde);
      }
      .dica-caca {
        font-size: 14px;
        color: var(--cinza);
        margin: 0 0 12px;
        text-align: center;
      }
      .restam {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 18px;
      }
      /* ordem */
      .slots {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 14px;
      }
      .slot {
        min-height: 46px;
        border-radius: 16px;
        border: 2px dashed #c8d8d0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--cinza);
      }
      .slot.cheio {
        border: 2px solid var(--verde);
        background: var(--verde-cl);
        color: var(--verde-esc);
      }
      .slot .n {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        flex: none;
      }
      .opcoes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .opc {
        background: var(--branco);
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 3px 0 #d9e4df;
        text-align: left;
      }
      .opc:active {
        transform: translateY(2px);
      }
      /* resultado */
      .resultado {
        text-align: center;
        padding-top: 10px;
      }
      .resultado .big {
        font-size: 64px;
      }
      .resultado h2 {
        font-size: 32px;
        margin: 6px 0;
      }
      .resultado .pts {
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 800;
        font-size: 44px;
        color: var(--verde);
      }
      .resultado .estrelas {
        font-size: 40px;
        margin: 6px 0 14px;
      }
      .revisao {
        text-align: left;
        background: var(--branco);
        border-radius: 20px;
        padding: 14px 16px;
        margin: 14px 0;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .revisao h3 {
        font-size: 18px;
        margin-bottom: 6px;
      }
      .revisao li {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.4;
      }
      .revisao li b {
        display: block;
      }
      .medalha-nova {
        background: var(--ouro-cl);
        border: 2px solid var(--ouro);
        border-radius: 18px;
        padding: 10px 14px;
        margin: 10px 0;
        font-weight: 600;
      }
      /* conquistas / ranking */
      .grade {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .med {
        background: var(--branco);
        border-radius: 20px;
        padding: 14px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .med .ic {
        font-size: 36px;
      }
      .med.bloq {
        opacity: 0.4;
        filter: grayscale(1);
      }
      .med h3 {
        font-size: 15px;
        margin-top: 4px;
      }
      .med small {
        color: var(--cinza);
        font-size: 12px;
      }
      .rank {
        background: var(--branco);
        border-radius: 20px;
        padding: 6px 14px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .rank div {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--linha);
        font-weight: 600;
      }
      .rank div:last-child {
        border: 0;
      }
      .confete {
        position: fixed;
        width: 10px;
        height: 14px;
        top: -20px;
        z-index: 50;
        pointer-events: none;
        animation: cai linear forwards;
      }
      @keyframes cai {
        to {
          transform: translateY(110vh) rotate(720deg);
        }
      }
      .oculto {
        display: none !important;
      }

        if (!P.som) return;
        try {
          ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
          const notas = { certo: [660, 880], errado: [220, 160], fim: [523, 659, 784, 1046], clique: [500] }[tipo] || [500];
          notas.forEach((f, i) => {
            const o = ctx.createOscillator(),
              g = ctx.createGain();
            o.type = tipo === "errado" ? "sawtooth" : "sine";
            o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + i * 0.09 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.09 + 0.18);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(ctx.currentTime + i * 0.09);
            o.stop(ctx.currentTime + i * 0.09 + 0.2);
          });
        } catch (_) {}

      function ativaArraste() {
        const el = $("#carta");
        if (!el) return;
        let x0 = null,
          dx = 0;
        el.addEventListener("pointerdown", e => {
          x0 = e.clientX;
          dx = 0;

          el.style.transition = "none";
        });

        if (J.modo === "duelo") pararTimer();
        const c = J.cartas[J.i],
          certo = pode === c.ok,
          el = $("#carta");
        cartaAtual = c;
        if (el) {
          el.style.transform = `translateX(${pode ? 110 : -110}%) rotate(${pode ? 14 : -14}deg)`;
          el.style.opacity = "0";
        }
        if (certo) {
          J.combo++;
          J.acertos++;
          const ganho = J.modo === "duelo" ? 10 + Math.ceil(Math.max(0, J.tCarta) / 3) : 10 + Math.min(J.combo - 1, 5) * 2;
          J.pts += ganho;
          P.melhorCombo = Math.max(P.melhorCombo, J.combo);
          bip("certo");
          vibra(20);
          flutua("+" + ganho, "#12805F");
        } else {
          J.combo = 0;
          J.erros.push(c);
          if (J.modo === "pn") J.vidas--;
          bip("errado");
          vibra([60, 40, 60]);
        }
        if (J.modo === "rel") {
          if (!certo) flutua("✗", "#D6402F");
          setTimeout(() => {
            J.travado = false;
            proxima();
          }, 260);
          return;
        }
        mostraFeedback(
          certo,
          (pode === null ? "⏰ Tempo esgotado! " : "") + (c.ok ? "PODE. " : "NÃO PODE. ") + c.e,
          () => {
            J.travado = false;
            proxima();
          },
          c.ev
        );
      }
      function proxima() {
        J.i++;
        if (J.modo === "rel" && J.i >= J.cartas.length) {
          J.cartas = J.cartas.concat(embaralha(PERGUNTAS));
        }
        if (J.modo === "pn" && (J.i >= J.cartas.length || J.vidas <= 0)) return fimRodada();
        if (J.modo === "duelo" && J.i >= J.cartas.length) return fimDuelo();
        desenhaCarta();
      }
      function provaHtml(key) {
        const ev = EV[key];
        if (!ev) return "";
        return `<div class="prova ${ev.f === F_ELI ? "eli" : ""}"><div class="fonte">📄 ${esc(ev.f)}</div><div class="secao">${esc(ev.s)}</div>${ev.x.map(t => `<blockquote>${esc(t)}</blockquote>`).join("")}</div>`;
      }
      function verDoc(key) {
        return EV[key] ? `<details class="ver-doc"><summary>📄 Ver no documento</summary>${provaHtml(key)}</details>` : "";
      }
      function mostraFeedback(certo, texto, depois, evKey) {
        const fb = $("#fb");
        const bd = $("#fbDoc"),
          pv = $("#fbProva");
        pv.className = "oculto";
        pv.innerHTML = provaHtml(evKey);
        bd.classList.toggle("oculto", !EV[evKey]);
        bd.textContent = "📄 Ver no documento";
        $("#fbCorr").classList.toggle("oculto", !cartaAtual);
        fb.scrollTop = 0;
        fb.className = "feedback on " + (certo ? "certo" : "errado");
        $("#fbT").textContent = certo
          ? ["Isso aí! 🎉", "Mandou bem! ✨", "Certinho! ✅", "Arrasou! 💚"][Math.floor(Math.random() * 4)]
          : "Quase! 😬";
        $("#fbP").textContent = texto;
        $("#fbB").textContent = "Continuar";
        fbDepois = () => {
          fb.className = "feedback";
          depois();
        };
      }
      let fbDepois = null;

      function fimRodada() {
        pararTimer();
        const modo = J.modo;
        let estrelas = 0,
          tit,
          novaEstrela = false;
        P.rodadas++;
        P.xp += J.pts;
        if (modo === "pn") {
          const tot = J.cartas.length;
          estrelas = J.acertos === tot ? 3 : J.acertos >= tot * 0.8 ? 2 : J.acertos >= tot * 0.6 ? 1 : 0;
          if (J.quizId) {
            if (estrelas > (P.estrelasQuiz[J.quizId] || 0)) {
              P.estrelasQuiz[J.quizId] = estrelas;
              novaEstrela = true;
            }
          } else if (J.tema !== "todos" && estrelas > (P.estrelas[J.tema] || 0)) {
            P.estrelas[J.tema] = estrelas;
            novaEstrela = true;
          }
          if (J.acertos === tot) P.medalhas.gabarito = P.medalhas.gabarito || Date.now();
          tit = J.vidas <= 0 ? "Acabaram as vidas!" : estrelas === 3 ? "Gabaritou!" : estrelas >= 1 ? "Muito bem!" : "Bora tentar de novo?";
        } else {
          if (J.pts > P.recordeRel) P.recordeRel = J.pts;
          tit = "Tempo esgotado!";
        }
        registraRanking(
          J.pts,
          modo === "rel" ? "Relâmpago" : J.quizId ? "Quiz" : "Pode ou Não Pode",
          J.titulo || J.tema,
          J.acertos,
          modo === "rel" ? J.i : J.cartas.length
        );
        const novas = checaMedalhas();
        salvar();
        if (estrelas >= 2 || novas.length || (modo === "rel" && J.pts >= P.recordeRel && J.pts > 0)) {
          confete();
          bip("fim");
        }
        const revisao = J.erros.length
          ? `<div class="revisao"><h3>📚 Para revisar</h3><ul>${J.erros.map(e => `<li><b>${esc(e.q)}</b>${e.ok ? "✅ Pode" : "⛔ Não pode"} — ${esc(e.e)}${verDoc(e.ev)}${corrBtn(e)}</li>`).join("")}</ul></div>`
          : "";
        app.innerHTML = `<div class="resultado">
    <div class="big">${modo === "rel" ? "⚡" : estrelas === 3 ? "💎" : estrelas >= 1 ? "🎉" : "💪"}</div>
    <h2>${tit}</h2>
    ${modo === "pn" ? estrelasHtml(estrelas) : `<p>${J.acertos} acertos · recorde: <b>${P.recordeRel}</b></p>`}
    <div class="pts">+${J.pts} XP</div>
    <p style="color:var(--cinza)">${modo === "pn" ? `${J.acertos} de ${J.cartas.length} acertos` : ""} ${novaEstrela ? " · nova marca no tema!" : ""}</p>
    ${novas.map(m => `<div class="medalha-nova">${m.ic} Nova conquista: <b>${m.n}</b></div>`).join("")}
    ${revisao}
    <div class="botoes"><button class="bt claro" data-ir="home">Início</button><button class="bt pode" data-de-novo="1">Jogar de novo</button></div>
  </div>`;
        J.encerrado = true;
      }

      /* ---------- MODO: Caça ao Erro ---------- */
      let C = null;
      function telaCacaLista() {
        app.innerHTML =
          topo("🔍 Caça ao Erro") +
          `<p class="dica-caca">Toque em tudo o que está errado. Tocar numa parte certa custa uma vida.</p>` +
          CACA.map((a, i) => {
            const nErr = a.partes.filter(p => !p.ok).length;
            return `<button class="tema" data-caca="${i}"><span class="ic" style="background:${a.tipo === "imp" ? "#D6402F22" : "#7A4FBF22"}">${a.tipo === "imp" ? "🖨️" : "🌐"}</span>
      <span class="tx"><h3>${esc(a.tit)}</h3><small>${nErr} erros escondidos</small></span>${P.caca[i] ? "✅" : ""}</button>`;
          }).join("");
      }
      function iniciarCaca(i) {
        const a = CACA[i];
        C = { i, a, achados: new Set(), vidas: 3, pts: 0, toques: 0, fim: false };
        desenhaCaca();
      }
      function desenhaCaca() {
        const a = C.a,
          total = a.partes.filter(p => !p.ok).length;
        const corpo = a.partes
          .map((p, k) => {
            const achou = C.achados.has(k);
            const mostraOk = C.fim && p.ok;
            return `<button class="parte ${p.cls} ${achou ? "achou" : ""} ${mostraOk ? "certinho" : ""}" data-parte="${k}">${esc(p.txt)}</button>`;
          })
          .join("");
        app.innerHTML =
          topo("🔍 " + esc(a.tit)) +
          `
    <div class="hud"><span class="pill">⭐ ${C.pts}</span><div class="restam" style="flex:1;text-align:center">Faltam ${total - C.achados.size} de ${total}</div><div class="vidas">${"❤️".repeat(C.vidas)}${"🤍".repeat(3 - C.vidas)}</div></div>
    <div class="anuncio ${a.tipo} ${a.cor || ""}">${a.tipo === "online" ? `<div class="barra-url">🔒 medguias.com.br/...</div>` : ""}${corpo}</div>
    <p class="dica-caca" style="margin-top:14px">${a.tipo === "imp" ? "Arte impressa — revise como se fosse para a gráfica." : "Anúncio no site / admin."}</p>`;
      }
      function tocarParte(k, ev) {
        if (!C || C.fim) return;
        const p = C.a.partes[k];
        cartaAtual = { q: p.txt, e: p.e, ref: "caca:" + C.i + ":" + k, quiz: "Caça ao Erro — " + C.a.tit };
        if (!p.ok) {
          if (C.achados.has(k)) return;
          C.achados.add(k);
          C.pts += 15;
          bip("certo");
          vibra(20);
          flutua("+15", "#12805F", ev?.clientX, ev?.clientY);
          const total = C.a.partes.filter(x => !x.ok).length;
          desenhaCaca();
          mostraFeedback(
            true,
            p.e,
            () => {
              if (C.achados.size === total) fimCaca(true);
            },
            p.ev
          );
        } else {
          C.vidas--;
          bip("errado");
          vibra([60, 40, 60]);
          const el = document.querySelector(`[data-parte="${k}"]`);
          el?.classList.add("shake");
          desenhaCaca();
          mostraFeedback(false, "Essa parte está correta. Procure o que fere as regras.", () => {
            if (C.vidas <= 0) fimCaca(false);
          });
        }
      }
      function fimCaca(venceu) {
        C.fim = true;
        if (venceu) {
          C.pts += C.vidas * 5;
          P.caca[C.i] = true;
        }
        P.xp += C.pts;
        P.rodadas++;
        registraRanking(C.pts, "Caça ao Erro", C.a.tit, C.achados.size, C.a.partes.filter(x => !x.ok).length);
        const novas = checaMedalhas();
        salvar();
        if (venceu) {
          confete();
          bip("fim");
        }
        const faltaram = C.a.partes.map((p, k) => ({ p, k })).filter(x => !x.p.ok && !C.achados.has(x.k));
        app.innerHTML = `<div class="resultado">
    <div class="big">${venceu ? "🕵️" : "💔"}</div>
    <h2>${venceu ? "Achou todos os erros!" : "Acabaram as vidas"}</h2>
    <div class="pts">+${C.pts} XP</div>
    ${venceu && C.vidas === 3 ? `<p>Sem nenhum toque errado! 👏</p>` : ""}
    ${novas.map(m => `<div class="medalha-nova">${m.ic} Nova conquista: <b>${m.n}</b></div>`).join("")}
    ${faltaram.length ? `<div class="revisao"><h3>🔎 Erros que faltaram</h3><ul>${faltaram.map(x => `<li><b>${esc(x.p.txt)}</b>${esc(x.p.e)}${verDoc(x.p.ev)}${corrBtn({ q: x.p.txt, e: x.p.e, ref: "caca:" + C.i + ":" + x.k, quiz: "Caça ao Erro — " + C.a.tit })}</li>`).join("")}</ul></div>` : ""}
    <div class="botoes"><button class="bt claro" data-ir="caca">Outros anúncios</button><button class="bt pode" data-caca="${C.i}">Jogar de novo</button></div>
    <button class="bt claro" data-ir="home" style="width:100%;margin-top:12px">🏠 Início</button>
  </div>`;
      }

      /* ---------- MODO: Monte o Processo ---------- */
      let O = null;
      function telaOrdemLista() {
        app.innerHTML =
          topo("🧩 Monte o Processo") +
          `<p class="dica-caca">Toque nas etapas na ordem certa, da primeira à última.</p>` +
          ORDENS.map(
            (o, i) => `<button class="tema" data-ordem="${i}"><span class="ic" style="background:#7A4FBF22">${o.ic}</span>
      <span class="tx"><h3>${esc(o.tit)}</h3><small>${o.passos.length} etapas</small></span>${P.ordem[i] === 0 ? "💎" : P.ordem[i] !== undefined ? "✅" : ""}</button>`
          ).join("");
      }
      function iniciarOrdem(i) {
        O = { i, o: ORDENS[i], feitos: [], resto: embaralha(ORDENS[i].passos), erros: 0, pts: 0 };
        desenhaOrdem();
      }
      function desenhaOrdem() {
        const o = O.o;
        app.innerHTML =
          topo("🧩 " + esc(o.tit)) +
          `
    <div class="hud"><span class="pill">⭐ ${O.pts}</span><div class="prog"><i style="width:${(100 * O.feitos.length) / o.passos.length}%"></i></div><span class="pill">✗ ${O.erros}</span></div>
    <div class="slots">${o.passos.map((_, k) => `<div class="slot ${k < O.feitos.length ? "cheio" : ""}"><span class="n">${k + 1}</span>${k < O.feitos.length ? esc(O.feitos[k]) : ""}</div>`).join("")}</div>
    <div class="opcoes">${O.resto.map((s, k) => `<button class="opc" data-passo="${k}">${esc(s)}</button>`).join("")}</div>`;
      }
      function tocarPasso(k) {
        const s = O.resto[k],
          certo = O.o.passos[O.feitos.length] === s;
        if (certo) {
          O.feitos.push(s);
          O.resto.splice(k, 1);
          O.pts += 10;
          bip("certo");
          vibra(15);
          if (!O.resto.length) return fimOrdem();
          desenhaOrdem();
        } else {
          O.erros++;
          bip("errado");
          vibra([60, 40, 60]);
          const b = document.querySelector(`[data-passo="${k}"]`);
          b?.classList.add("shake");
          setTimeout(() => b?.classList.remove("shake"), 400);
          const p = document.querySelector(".hud .pill:last-child");
          if (p) p.textContent = "✗ " + O.erros;
        }
      }
      function fimOrdem() {
        const bonus = Math.max(0, 30 - O.erros * 10);
        O.pts += bonus;
        const ant = P.ordem[O.i];
        P.ordem[O.i] = ant === undefined ? O.erros : Math.min(ant, O.erros);
        P.xp += O.pts;
        P.rodadas++;
        registraRanking(O.pts, "Monte o Processo", O.o.tit, O.o.passos.length - O.erros, O.o.passos.length);
        const novas = checaMedalhas();
        salvar();
        confete();
        bip("fim");
        app.innerHTML = `<div class="resultado">
    <div class="big">${O.erros === 0 ? "💎" : "🧩"}</div>
    <h2>${O.erros === 0 ? "Processo perfeito!" : "Processo montado!"}</h2>
    <div class="pts">+${O.pts} XP</div>
    <p>${O.erros === 0 ? "Nenhum erro." : O.erros + " toque(s) fora de ordem."}</p>
    ${novas.map(m => `<div class="medalha-nova">${m.ic} Nova conquista: <b>${m.n}</b></div>`).join("")}
    <div class="revisao"><h3>✅ A ordem certa</h3><ol>${O.o.passos.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
    <div class="botoes"><button class="bt claro" data-ir="ordem">Outro processo</button><button class="bt pode" data-ordem="${O.i}">Jogar de novo</button></div>
    <button class="bt claro" data-ir="home" style="width:100%;margin-top:12px">🏠 Início</button>
  </div>`;
      }

      /* ---------- Conquistas e ranking ---------- */
      function telaMedalhas() {
        app.innerHTML =
          topo("🏅 Conquistas") +
          `<div class="grade">${MEDALHAS.map(m => `<div class="med ${P.medalhas[m.id] ? "" : "bloq"}"><div class="ic">${m.ic}</div><h3>${m.n}</h3><small>${m.d}</small></div>`).join("")}</div>`;
      }
      /* ---------- Navegação e eventos ---------- */
      const TELAS = {
        home: telaHome,
        temas: telaTemas,
        caca: telaCacaLista,
        ordem: telaOrdemLista,
        relampago: iniciarRelampago,
        medalhas: telaMedalhas
      };
      function ir(t) {
        if (
          J &&
          J.modo === "duelo" &&
          !J.encerrado &&
          t !== "duelos-sair" &&
          !confirm("Sair do duelo agora? Ele volta para a lista e você pode jogar depois do começo.")
        )
          return;
        pararTimer();
        $("#fb").className = "feedback";
        fbDepois = null;
        J = null;
        cartaAtual = null;
        CORR_TMP = [];
        fecharModal();
        telaAtual = TELAS[t] ? t : "home";
        TELAS[telaAtual]();
        window.scrollTo({ top: 0 });
      }

      document.addEventListener("click", e => {
        const t = e.target;
        if (t.closest("#fbB")) {
          const f = fbDepois;
          fbDepois = null;
          f && f();
          return;
        }
        if (t.closest("#fbDoc")) {
          const pv = $("#fbProva"),
            ab = pv.classList.toggle("oculto");
          t.closest("#fbDoc").textContent = ab ? "📄 Ver no documento" : "📄 Esconder trecho";
          if (!ab) setTimeout(() => pv.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
          return;
        }
        const g = t.closest("[data-ir]");
        if (g) {
          bip("clique");
          return ir(g.dataset.ir);
        }
        if (t.closest("[data-som]")) {
          P.som = !P.som;
          salvar();
          return telaHome();
        }
        const tm = t.closest("[data-tema]");
        if (tm) {
          bip("clique");
          return iniciarPN(tm.dataset.tema);
        }
        const r = t.closest("[data-resp]");
        if (r) return responder(r.dataset.resp === "1");
        if (t.closest("[data-de-novo]")) {
          return J && J.modo === "rel" ? iniciarRelampago() : J ? iniciarPN(J.tema, J.baralho, J.titulo, J.quizId) : iniciarPN("todos");
        }
        const cc = t.closest("[data-caca]");
        if (cc) {
          bip("clique");
          return iniciarCaca(+cc.dataset.caca);
        }
        const pt = t.closest("[data-parte]");
        if (pt) return tocarParte(+pt.dataset.parte, e);
        const od = t.closest("[data-ordem]");
        if (od) {
          bip("clique");
          return iniciarOrdem(+od.dataset.ordem);
        }
        const ps = t.closest("[data-passo]");
        if (ps) return tocarPasso(+ps.dataset.passo);
      });
      document.addEventListener("keydown", e => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $("#modal.on")) return;
        if (fbDepois && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          const f = fbDepois;
          fbDepois = null;
          return f();
        }
        if (J && !fbDepois && $("#carta")) {
          if (e.key === "ArrowLeft") responder(false);
          if (e.key === "ArrowRight") responder(true);
        }
      });
      /* ================== ARRANQUE ================== */
      Object.assign(TELAS, {
        perfil: telaPerfil,
        ranking: telaRanking,
        correcoes: telaCorrecoes,
        duelos: telaDuelos,
        quizzes: telaQuizzes,
        equipe: telaEquipe,
        admin: telaAdmin
      });
      iniciar();
    </script>
  </body>
</html>
